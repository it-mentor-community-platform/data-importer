spring:
  application:
    name: data-importer
logging:
    level:
      root: INFO

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: when_authorized

google:
  credentials:
    path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    json: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:}