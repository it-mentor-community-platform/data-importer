spring:
  config:
    activate:
      on-profile: staging

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION}
    topic:
      projects-project-created: staging.projects.project.created

server:
  port: 8080

dataimporter:
  project-spreadsheet-id: ${PROJECT_SPREADSHEET_ID}
  mentor-spreadsheet-id: ${MENTOR_SPREADSHEET_ID}
  guaranteed-reviews-spreadsheet-id: ${GUARANTEED_REVIEWS_SPREADSHEET_ID}
  sheet-range-telegram-accounts: "Telegram аккаунты студентов!A2:C"
  sheet-range-projects: "Projects!A3:I"
  sheet-range-guaranteed-reviews: "B7:E"
  sheet-range-project-reviews: "Reviews!A2:I"
  auth-service-base-url: "http://auth-service:8080"
  profile-service-base-url: "http://profile-service:8080"
  project-service-base-url: "http://project-service:8080"
  mentor-service-base-url: "http://mentor-service:8080"

management:
  endpoint:
    health:
      show-details: always